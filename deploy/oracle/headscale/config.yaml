# Headscale (self-hosted Tailscale control server) for the power dashboard.
# Installed by setup-vm.sh as /etc/headscale/config.yaml, with {{HS_DOMAIN}} filled in.
# Based on the official config-example.yaml; check it after upgrades:
#   https://github.com/juanfont/headscale/blob/main/config-example.yaml
# After editing:  sudo headscale configtest && sudo systemctl restart headscale

# Public URL clients use to reach this server. Caddy serves it over HTTPS and forwards to
# listen_addr; Headscale itself only listens locally.
server_url: https://{{HS_DOMAIN}}
listen_addr: 127.0.0.1:8081
metrics_listen_addr: 127.0.0.1:9090
grpc_listen_addr: 127.0.0.1:50443
grpc_allow_insecure: false
# Caddy on this machine is the only proxy in front.
trusted_proxies:
  - 127.0.0.1/32

noise:
  private_key_path: /var/lib/headscale/noise_private.key

# Addresses handed out to devices on the private network (Tailscale's ranges).
prefixes:
  v4: 100.64.0.0/10
  v6: fd7a:115c:a1e0::/48
  allocation: sequential

# Relays for when a direct connection isn't possible: Tailscale's public DERP servers.
# The VM has a public IP with UDP 41641 open, so the Pi normally connects to it directly.
derp:
  server:
    enabled: false
  urls:
    - https://controlplane.tailscale.com/derpmap/default
  paths: []
  auto_update_enabled: true
  update_frequency: 3h

disable_check_updates: false

node:
  # Devices don't need to log in again periodically (the Pi runs unattended).
  expiry: 0
  ephemeral:
    inactivity_timeout: 30m

database:
  type: sqlite
  sqlite:
    path: /var/lib/headscale/db.sqlite
    write_ahead_log: true

# TLS is handled by Caddy, so Headscale's own certificate support stays off.
tls_letsencrypt_hostname: ""
tls_cert_path: ""
tls_key_path: ""

log:
  level: info
  format: text

# Who may reach whom (default deny). See policy.hujson.
policy:
  mode: file
  path: /etc/headscale/policy.hujson

dns:
  # Devices join with --accept-dns=false, so this doesn't change their DNS settings.
  magic_dns: true
  base_domain: power.tailnet
  override_local_dns: false
  nameservers:
    global: []
    split: {}
  search_domains: []
  extra_records: []

unix_socket: /var/run/headscale/headscale.sock
unix_socket_permission: "0770"

logtail:
  enabled: false
taildrop:
  enabled: false
