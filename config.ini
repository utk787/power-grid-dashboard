# Power Status configuration.
#
# Read once when the app starts: restart after editing (sudo systemctl restart powersensor).
# Every setting is optional; a commented-out or missing line uses the default shown.
# Unknown keys or invalid values stop the app with an error naming the bad line.
# Comments must be on their own line (a '#' after a value is part of the value).

[sensor]
# Address of the power sensor. It replies with the text below while mains power is on.
url = http://192.168.1.249/
# Text in the reply that means "power is on" (case-insensitive, matched anywhere in the reply).
match = Mains On
# Seconds between checks.
poll_interval = 5
# Seconds to wait for the sensor before a check counts as failed.
request_timeout = 3
# Consecutive failed checks before an outage is declared (3 x 5 s = about 15 s).
# Raise it if Wi-Fi is flaky and you see short false outages.
fail_threshold = 3

[monitor]
# Seconds between "monitor is alive" timestamps written to the database.
heartbeat_interval = 60
# If the app itself was down longer than this many seconds (e.g. the Pi lost power),
# the gap is recorded as a likely outage with an approximate start time.
gap_threshold = 180

[storage]
# SQLite database file. A relative path is relative to this config file's folder.
db_path = power.db

[server]
# Address to listen on: 0.0.0.0 = whole LAN, 127.0.0.1 = only this Pi (e.g. behind a tunnel).
host = 0.0.0.0
port = 8080
# Shown in the page header and browser tab.
site_name = Power Grid Status
